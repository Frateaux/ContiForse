<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#blueGrad)"/>
  
  <!-- Central Shield / Vault Graphic -->
  <g filter="url(#dropShadow)">
    <!-- Shield Outline -->
    <path d="M256 84 L396 144 V268 C396 352 334 416 256 448 C178 416 116 352 116 268 V144 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Lock body -->
    <rect x="210" y="240" width="92" height="74" rx="16" fill="#1e3a8a"/>
    <!-- Lock shackle -->
    <path d="M228 240 V205 C228 189 240 176 256 176 C272 176 284 189 284 205 V240" fill="none" stroke="#1e3a8a" stroke-width="16" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="256" cy="272" r="7" fill="#ffffff"/>
    <path d="M253 275 L251 292 H261 L259 275 Z" fill="#ffffff"/>
    <!-- Checkmark badge overlay -->
    <circle cx="340" cy="320" r="32" fill="#10b981"/>
    <polyline points="328,320 336,328 352,312" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
